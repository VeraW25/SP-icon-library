<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon Power Icons Library</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; margin: 0; background-color: #f9fafb; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* 增加平滑滾動 */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
          Zap, Shield, Wifi, HardDrive, Monitor, Cable, Layers, 
          ArrowLeft, Search, ChevronRight, Package, ShoppingBag, 
          LifeBuoy, Megaphone, Star, Building2, Hash 
        } = LucideReact;

        // --- 1. 定義分類資料 ---
        const SPECS_CATEGORIES = [
          { id: 'specs-product-lines', title: '產品類別', icon: Package, desc: '各產品系列規格識別' },
          { id: 'transmission', title: '傳輸速度與效能', icon: Cable, desc: '線材、接口與數據傳輸規範' },
          { id: 'power', title: '電力與充電', icon: Zap, desc: '電池、充電與電源管理' },
          { id: 'protection', title: '防護與耐用', icon: Shield, desc: '防水防塵 IP 等級與外殼' },
          { id: 'interface', title: '產品介面與外觀', icon: Layers, desc: '實體按鍵與觸控交互' },
          { id: 'device-env', title: '裝置與環境', icon: Monitor, desc: '螢幕、操作環境與周邊' },
          { id: 'cert-tech', title: '認證與技術', icon: Wifi, desc: '各國安規認證與無線技術' },
          { id: 'commercial', title: '商業服務與通用', icon: Building2, desc: '企業解決方案與通用標示' },
        ];

        const BRAND_CATEGORIES = [
          { id: 'product-lines', title: '產品類別', icon: Package, desc: '各產品系列識別圖示' },
          { id: 'ecommerce', title: '會員電商', icon: ShoppingBag, desc: '購物車、會員等級、優惠券、點數' },
          { id: 'support', title: '客服支援', icon: LifeBuoy, desc: '保固圖示、維修流程、線上諮詢' },
          { id: 'marketing', title: '行銷活動', icon: Megaphone, desc: '促銷標籤、活動 Banner 元素' },
          { id: 'features', title: '品牌特色', icon: Star, desc: '獨家技術、核心價值' },
          { id: 'corporate', title: '企業形象', icon: Building2, desc: 'Logo 規範、辦公室指引' },
        ];

        // --- 2. 核心資料庫 (妳提供的完整內容) ---
        const ITEMS_DATA = {
          'specs-product-lines': [
            { id: 1, name: '記憶體', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/products/memory-module.png', keywords: 'Memory Module', group: '產品類別' },
            { id: 2, name: '固態硬碟', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/products/ssd.png', keywords: 'SSD', group: '產品類別' },
            { id: 3, name: '外接固態硬碟', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/products/external-ssd.png', keywords: 'External SSD', group: '產品類別' },
            { id: 4, name: '行動電源', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/products/power-bank.png', keywords: 'Power Bank', group: '產品類別' },
            { id: 5, name: '記憶卡', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/products/sd-card.png', keywords: 'Memory Card', group: '產品類別' },
            { id: 6, name: '隨身碟', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/products/flash-drive.png', keywords: 'Flash Drive', group: '產品類別' },
            { id: 7, name: '配件', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/products/accessories.png', keywords: 'Accessories', group: '產品類別' },
          ],
          'transmission': [
            { id: 7, name: 'V90高速傳輸規格', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/speed/high-speed-standard-v90.png', keywords: 'High-Speed Standard V90', group: '速度等級' },
            { id: 6, name: 'V60高速傳輸規格', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/speed/high-speed-standard-v60.png', keywords: 'High-Speed Standard V60', group: '速度等級' },
            { id: 5, name: 'V30高速傳輸規格', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/speed/high-speed-standard-v30.png', keywords: 'High-Speed Standard V30', group: '速度等級' },
            { id: 8, name: '啟動時間縮短', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/speed/faster-boot-time.png', keywords: 'Faster Boot Time', group: '讀寫行為' },
            { id: 4, name: '讀寫速度', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/speed/read-write-speed.png', keywords: 'Read/Write Speed', group: '讀寫行為' },
            { id: 11, name: '性能提升', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/speed/performance-boost.png', keywords: 'Performance Boost', group: '效能特色' },
          ],
          'power': [
            { id: 301, name: 'PD快充', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/electricity/pd-fast-charging.png', keywords: 'PD Fast Charging', group: '充電技術' },
            { id: 302, name: '無線快充', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/electricity/wireless-charging.png', keywords: 'Wireless Charging', group: '充電技術' },
            { id: 303, name: '毫安培(mAh)', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/electricity/mAh-capacity.png', group: '電池規格' },
          ],
          'protection': [
            { id: 401, name: 'IP4防水', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/protection/ipx4-waterproof.png', group: '環境防護' },
            { id: 402, name: '軍規防震', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/protection/military-grade-shockproof.png', group: '抗震耐用' },
          ],
          'interface': [
            { id: 501, name: 'Type-C', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/interface/type-c.png', group: '傳輸介面' },
            { id: 502, name: 'RGB 燈效', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/interface/rgb-lighting.png', group: '外觀工藝與功能' },
          ],
          'device-env': [
            { id: 601, name: '桌電適用', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/device/desktop-compatible.png', group: '運算與遊戲裝置' },
          ],
          'product-lines': [
            { id: 1001, name: '固態硬碟', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/(pink)products/ssd.png', group: '產品類別' },
          ],
          'ecommerce': [
            { id: 1101, name: '會員招募', imageUrl: 'https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/e-shop/member-recruitment.png', group: '會員機制' },
          ]
        };

        // --- 3. 組件：圖示卡片 ---
        const IconCard = ({ item, variant }) => {
          const isSpecs = variant === 'specs';
          return (
            <div className="flex flex-col items-center justify-center text-center gap-2.5 p-4 border border-gray-100 transition-all duration-300 bg-white rounded-xl shadow-sm hover:shadow-md hover:border-pink-200 h-full">
              <div className="w-16 h-16 sm:w-[88px] sm:h-[88px] flex items-center justify-center shrink-0 mb-1">
                {item.imageUrl ? (
                  <img src={item.imageUrl} alt={item.name} className="w-full h-full object-contain" />
                ) : item.icon ? (
                  <item.icon className="w-full h-full text-gray-300" />
                ) : (
                  <div className="w-12 h-12 border-2 border-gray-300 rounded-full flex items-center justify-center font-bold text-xs text-gray-400">
                    {item.name.substring(0, 2).toUpperCase()}
                  </div>
                )}
              </div>
              <div className="flex flex-col w-full">
                <h4 className="font-bold text-[13px] sm:text-sm text-gray-900 mb-0.5 truncate">{item.name}</h4>
                {item.keywords && <p className="text-[10px] text-gray-400 break-words leading-tight">{item.keywords}</p>}
              </div>
            </div>
          );
        };

        // --- 4. 組件：詳情頁面 ---
        const DetailPage = ({ category, context, onBack, onSwitchCategory }) => {
          const items = ITEMS_DATA[category.id] || [];
          const isSpecs = context === 'specs';
          const categories = isSpecs ? SPECS_CATEGORIES : BRAND_CATEGORIES;
          const groups = [...new Set(items.map(i => i.group).filter(Boolean))];

          const scrollToGroup = (groupName) => {
            const element = document.getElementById(groupName);
            if (element) {
              const offset = 220;
              const bodyRect = document.body.getBoundingClientRect().top;
              const elementRect = element.getBoundingClientRect().top;
              const elementPosition = elementRect - bodyRect;
              window.scrollTo({ top: elementPosition - offset, behavior: 'smooth' });
            }
          };

          return (
            <div className="min-h-screen">
              <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-200">
                <div className="max-w-[1600px] mx-auto px-4 h-16 flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    <button onClick={onBack} className="p-2 hover:bg-gray-100 rounded-full transition-colors"><ArrowLeft size={24} /></button>
                    <h1 className="text-lg md:text-xl font-bold flex items-center gap-2">
                      <span className={`px-2 py-0.5 rounded text-sm text-white ${isSpecs ? 'bg-black' : 'bg-pink-600'}`}>
                        {isSpecs ? 'SPECS' : 'BRAND'}
                      </span>
                      <span>{category.title}</span>
                    </h1>
                  </div>
                  <div className="hidden md:flex items-center gap-2 text-xs text-gray-400 bg-gray-100 px-3 py-1.5 rounded-full">
                    <Search size={12} /><span>Ctrl + F to search</span>
                  </div>
                </div>
              </header>

              <div className="sticky top-16 z-40 bg-gray-50/95 backdrop-blur-sm border-b border-gray-200 py-4 shadow-sm">
                <div className="max-w-[1600px] mx-auto px-4">
                  <div className="flex items-center gap-3 overflow-x-auto pb-2 scrollbar-hide justify-center">
                    {categories.map((cat) => (
                      <button key={cat.id} onClick={() => onSwitchCategory(cat)}
                        className={`whitespace-nowrap px-5 py-2 rounded-full text-sm font-medium border transition-all ${cat.id === category.id ? (isSpecs ? 'bg-black text-white shadow-md scale-105' : 'bg-pink-600 text-white shadow-md scale-105') : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400'}`}>
                        {cat.title}
                      </button>
                    ))}
                  </div>
                  {groups.length > 0 && (
                    <div className="flex items-center justify-center gap-4 mt-4 flex-wrap text-xs text-gray-500">
                      {groups.map((g, idx) => (
                        <React.Fragment key={g}>
                          <button onClick={() => scrollToGroup(g)} className="hover:text-black">{g}</button>
                          {idx < groups.length - 1 && <span className="text-gray-300">|</span>}
                        </React.Fragment>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <main className="max-w-[1600px] mx-auto p-6 md:p-10 pb-40">
                {groups.length > 0 ? groups.map(group => (
                  <div key={group} id={group} className="mb-16 scroll-mt-48">
                    <h3 className="text-base font-bold text-gray-800 mb-6 pl-2 border-l-4 border-pink-500">{group}</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5">
                      {items.filter(i => i.group === group).map(item => <IconCard key={item.id} item={item} variant={context} />)}
                    </div>
                  </div>
                )) : <div className="text-center py-20 text-gray-400">此分類建置中...</div>}
              </main>
            </div>
          );
        };

        // --- 5. 組件：入口首頁 ---
        const LandingPage = ({ onSelectContext }) => (
          <div className="h-screen w-full flex flex-col md:flex-row overflow-hidden relative">
            <div className="absolute top-4 left-4 z-50 pointer-events-none">
              <h3 className="text-[10px] md:text-xs font-bold tracking-widest text-gray-500 uppercase">Silicon Power Icons Library</h3>
            </div>
            <div onClick={() => onSelectContext('specs')} className="relative flex-1 bg-gray-100 flex flex-col items-center justify-center p-10 group cursor-pointer border-r border-gray-200 transition-all duration-500 md:hover:flex-[1.2]">
              <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-8 shadow-sm group-hover:scale-110 transition-transform">
                <img src="https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/logo/spec.png" className="w-14 h-14 object-contain opacity-50 group-hover:opacity-100" />
              </div>
              <h2 className="text-2xl md:text-3xl font-black text-gray-900 tracking-widest">產品規格專區<span className="block text-base font-medium text-gray-400 mt-2">Technical Specs</span></h2>
            </div>
            <div onClick={() => onSelectContext('brand')} className="relative flex-1 bg-pink-600 flex flex-col items-center justify-center p-10 group cursor-pointer transition-all duration-500 md:hover:flex-[1.2] text-white">
              <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-8 shadow-sm group-hover:scale-110 transition-transform">
                <img src="https://cdn.jsdelivr.net/gh/VeraW25/sp-icons/logo/brand.png" className="w-14 h-14 object-contain opacity-50 group-hover:opacity-100" />
              </div>
              <h2 className="text-2xl md:text-3xl font-black tracking-widest">品牌識別專區<span className="block text-base font-medium text-pink-200 mt-2">Brand Identity</span></h2>
            </div>
          </div>
        );

        // --- 6. 主程式 ---
        function App() {
          const [context, setContext] = useState(null);
          const [activeCategory, setActiveCategory] = useState(null);

          const handleEnter = (ctx) => {
            setContext(ctx);
            setActiveCategory(ctx === 'specs' ? SPECS_CATEGORIES[0] : BRAND_CATEGORIES[0]);
          };

          if (!context) return <LandingPage onSelectContext={handleEnter} />;
          return <DetailPage context={context} category={activeCategory} onBack={() => setContext(null)} onSwitchCategory={setActiveCategory} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
