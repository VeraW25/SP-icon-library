const IconCard = ({ item, variant }) => {
  const isSpecs = variant === 'specs';

  const borderColor = isSpecs ? 'hover:border-gray-900' : 'hover:border-pink-300';

  // 邏輯升級：同時支援 SVG Component (icon) 與 圖片網址 (imageUrl)
  const ItemIconComponent = item.icon;
  const ItemImageUrl = item.imageUrl;

  return (
    <div className={`flex flex-col items-center justify-center text-center gap-2.5 p-4 border border-gray-100 transition-all duration-300 bg-white rounded-xl shadow-sm hover:shadow-md h-full`}>

      <div className="w-16 h-16 sm:w-[88px] sm:h-[88px] flex items-center justify-center shrink-0 mb-1">
        {ItemImageUrl ? (
          // 情況 A: 使用圖片網址 (方案 B)
          <img 
            src={ItemImageUrl} 
            alt={item.name} 
            className="w-full h-full object-contain"
          />
        ) : ItemIconComponent ? (
          // 情況 B: 使用 SVG 組件 (方案 A)
          <ItemIconComponent className="w-full h-full object-contain" />
        ) : (
          // 情況 C: 沒圖時的預設文字
          <div className="w-12 h-12 border-2 border-gray-300 rounded-full flex items-center justify-center font-bold text-xs text-gray-400">
            {item.name.substring(0, 2).toUpperCase()}

        )}
      </div>
      
      {/* 文字區域：微調文字大小與行距 */}
      <div className="flex flex-col w-full">
        <h4 className={`font-bold text-[13px] sm:text-sm ${titleColor} mb-0.5 truncate`}>
          {item.name}
        </h4>
        {/* 只有當 keywords 存在時才顯示 (品牌識別區通常無 keyword) */}
        {item.keywords && (
          <p className="text-[10px] sm:text-[11px] text-gray-400 break-words leading-tight select-all">
            {item.keywords}
          </p>

};

const DetailPage = ({ category, context, onBack, onSwitchCategory }) => {
  const items = ITEMS_DATA[category.id] || DEFAULT_ITEMS;
  const isSpecs = context === 'specs';
  const themeColor = isSpecs ? 'text-gray-900' : 'text-pink-600';
  const categories = isSpecs ? SPECS_CATEGORIES : BRAND_CATEGORIES;

  // Add useEffect for scrolling to top on category change
  useEffect(() => {
    const handleScroll = () => {
      window.scrollTo({ top: 0, behavior: 'instant' });
    };
    const timer = setTimeout(handleScroll, 10);
    return () => clearTimeout(timer);
  }, [category.id]);

  // Check if items have grouping
  const hasGroups = items.some(item => item.group);
  
  // Define group order mapping for specific categories
  const categoryGroupOrders = {
    'specs-product-lines': ['產品類別'],
    'transmission': ['速度等級', '讀寫行為', '效能特色'],
    'power': ['充電技術', '電池規格', '功能與狀態', '飛航相關'],
    'protection': ['環境防護', '抗震耐用', '溫控散熱'],
    'interface': ['傳輸介面', '影音規格', '結構設計', '外觀工藝與功能'],
    'device-env': ['運算與遊戲裝置', '影像與攝錄設備', '影音娛樂與其他'],
    'cert-tech': ['認證標章', '晶片與技術', '技術規範', '容量與特性'],
    'commercial': ['售後服務', '企業資訊', '聯絡與通知'],
    'product-lines': ['產品類別'],
    'support': ['諮詢管道', '保固維修'],
    'ecommerce': ['會員機制', '購物流程'],
    'marketing': ['導覽內容', '促銷購物'],
    'features': ['品牌實力', '技術優勢'],
    'corporate': ['企業形象'],
  };

  // Get group order for current category
  const groupOrder = categoryGroupOrders[category.id] || (hasGroups ? [...new Set(items.map(item => item.group).filter(Boolean))] : []);

  // Helper function to handle scrolling to a group
  const scrollToGroup = (groupName) => {
    const element = document.getElementById(groupName);
    if (element) {
      // Offset for sticky header (Header + Tabs + SubNav)
      // 已增加 offset 數值為 220，避免標題被遮擋
      const headerOffset = 220; 
      const elementPosition = element.getBoundingClientRect().top;
      const offsetPosition = elementPosition + window.scrollY - headerOffset;

      window.scrollTo({
        top: offsetPosition,
        behavior: "smooth"
      });
    }
  };

  // Helper to render grid：微調卡片數量列，讓 w-22 尺寸的卡片有足夠呼吸空間
  const renderGrid = (itemList) => (
    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 md:gap-5">
      {itemList.map((item) => (
        <IconCard key={item.id} item={item} variant={context} />
      ))}
    </div>
  );

  return (
    <div className="min-h-screen bg-gray-50/50 animate-in slide-in-from-right duration-300">
      {/* 1. Main Header (Sticky) */}
      <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-200">
        <div className="max-w-[1600px] mx-auto px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-4">
            <button onClick={onBack} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
              <ArrowLeft size={24} />
            </button>
            <h1 className="text-lg md:text-xl font-bold tracking-wide flex items-center gap-2">
              <span className={`px-2 py-0.5 rounded text-sm tracking-wide ${isSpecs ? 'bg-black text-white' : 'bg-pink-600 text-white'}`}>
                {isSpecs ? 'SPECS' : 'BRAND'}
              </span>
              <span>{category.title}</span>
            </h1>
          </div>
          <div className="hidden md:flex items-center gap-2 text-xs text-gray-400 bg-gray-100 px-3 py-1.5 rounded-full">
            <Search size={12} />
            <span>Ctrl + F to search</span>
          </div>
        </div>
      </header>

      {/* 2. Category Tabs Bar & Sub-navigation (Sticky below header) */}
      <div className="sticky top-16 z-40 bg-gray-50/95 backdrop-blur-sm border-b border-gray-200 shadow-sm flex flex-col">
        <div className="max-w-[1600px] mx-auto px-4 pt-5 pb-4 w-full">
          
          {/* Main Category Tabs */}
          <div className="flex items-center gap-3 overflow-x-auto pb-2 scrollbar-hide justify-center">
            {categories.map((cat) => (
              <button
                key={cat.id}
                onClick={() => onSwitchCategory(cat)}
                className={`
                  whitespace-nowrap px-5 py-2 rounded-full text-sm font-medium transition-all border
                  ${cat.id === category.id 
                    ? (isSpecs ? 'bg-black text-white border-black shadow-md scale-105' : 'bg-pink-600 text-white border-pink-600 shadow-md scale-105')
                    : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400 hover:text-gray-900'
                  }
                `}
              >
                {cat.title}
              </button>
            ))}
          </div>

          {/* Sub-navigation Anchors */}
          {hasGroups && groupOrder.length > 0 && (
            <div className="flex items-center justify-center gap-4 mt-4 mb-1 flex-wrap text-xs text-gray-500">
              {groupOrder.map((groupName, index) => (
                <React.Fragment key={`subnav-${groupName}`}>
                  <button
                    onClick={() => scrollToGroup(groupName)}
                    className="hover:text-black transition-colors font-normal tracking-wide"
                  >
                    {groupName}
                  </button>
                  {index < groupOrder.length - 1 && (
                    <span className="text-gray-300">|</span>
                  )}
                </React.Fragment>
              ))}
            </div>
          )}

        </div>
      </div>

      {/* 4. Main Content Area */}
      <main className="max-w-[1600px] mx-auto p-6 md:p-10 pb-96">
        
        {hasGroups ? (
          <div className="space-y-16">
            {groupOrder.map(groupName => {
              const groupItems = items.filter(i => i.group === groupName);
              if (groupItems.length === 0) return null;
              return (
                <div key={groupName} id={groupName} className="scroll-mt-48"> 
                  <h3 className="text-base font-bold text-gray-800 mb-4 pl-2 border-l-2 border-black flex items-center">
                    {groupName}
                  </h3>
                  {renderGrid(groupItems)}
                </div>
              );
            })}
          </div>
        ) : (
          renderGrid(items)
        )}

        <div className="mt-20 pt-8 border-t border-gray-200 text-center text-xs text-gray-400">
          最新更新時間：2026/02/10
        </div>
      </main>
    </div>
  );
};

export default function App() {
  const [context, setContext] = useState(null); // 'specs' | 'brand'
  const [activeCategory, setActiveCategory] = useState(null);

  // 進入區塊時的邏輯：設定 Context 並預設選取第一個分類
  const handleEnterContext = (selectedContext) => {
    setContext(selectedContext);
    if (selectedContext === 'specs') {
      setActiveCategory(SPECS_CATEGORIES[0]);
    } else {
      setActiveCategory(BRAND_CATEGORIES[0]);
    }
  };

  const goHome = () => {
    setContext(null);
    setActiveCategory(null);
  };

  // 1. 沒選 Context -> 首頁
  if (!context) {
    return <LandingPage onSelectContext={handleEnterContext} />;
  }

  // 2. 選了 Context (且因為自動設定了 activeCategory，所以直接進入 DetailPage)
  return (
    <>
      <style>
        {`
          @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;900&display=swap');
          body {
            font-family: 'Poppins', sans-serif;
          }
        `}
      </style>
      <DetailPage 
        context={context}
        category={activeCategory} 
        onBack={goHome}
        onSwitchCategory={setActiveCategory} // 傳遞切換分類的函式
      />
    </>
  );
}
      const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
